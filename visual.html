<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Data visualization dashboard</title>
    
    <!-- 使用本地 ECharts -->
    <script src="echarts.min.js"></script>
    <!-- 你的自定义脚本 -->
    <script src="visual.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 32px 24px;
        }

        /* 主容器 - 增加最大宽度和居中 */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e0e4e8;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .page-header p {
            color: #666;
            font-size: 14px;
        }

        /* 卡片通用样式 */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        .card-header {
            padding: 18px 24px;
            background: #fafbfc;
            border-bottom: 1px solid #edf0f2;
        }
        .card-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .card-header p {
            font-size: 13px;
            color: #8890a4;
            margin-top: 4px;
        }
        .card-body {
            padding: 24px;
        }

        /* 指标卡片网格 - 更大间距 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-item {
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .stat-label {
            font-size: 13px;
            color: #8890a4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .stat-unit {
            font-size: 14px;
            font-weight: 400;
            color: #8890a4;
            margin-left: 4px;
        }

        /* 图表区域 - 网格布局，间距更大 */
        .charts-section {
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid #3b82f6;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 28px;
        }
        .chart-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .chart-card-header {
            padding: 16px 20px;
            background: #fafbfc;
            border-bottom: 1px solid #edf0f2;
        }
        .chart-card-header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .chart-container {
            width: 100%;
            height: 320px;
            padding: 16px;
        }

        /* 线程统计区域 */
        .thread-section {
            margin-top: 16px;
        }
        .thread-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .thread-stat-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fc;
            border-radius: 16px;
        }
        .thread-stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #3b82f6;
        }
        .thread-stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }

        /* 响应式调整 */
        @media (max-width: 1100px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 20px 16px;
            }
        }

        /* 加载和错误状态 */
        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="page-header">
        <h1>📊 Comment data analysis report</h1>
        <p>visualization based on multi-dimensional data, including depth, branches, likes, and time</p>
    </div>

    <!-- 核心指标卡片（动态填充） -->
    <div id="stats-grid" class="stats-grid"></div>

    <!-- 分布直方图区域 -->
    <div class="charts-section">
        <div class="section-title">📈 Histogram of data distribution</div>
        <div id="charts-grid" class="charts-grid"></div>
    </div>

    <!-- 对话线程统计 -->
    <div class="charts-section thread-section">
        <div class="section-title">🧵 Dialog thread statistics</div>
        <div class="card">
            <div class="card-body">
                <div id="thread-stats-grid" class="thread-stats-grid"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
